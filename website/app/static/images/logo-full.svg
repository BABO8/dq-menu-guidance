<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 48" width="260" height="48" fill="none">
  <defs>
    <linearGradient id="fullDqGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E21837" />
      <stop offset="100%" stop-color="#B30E26" />
    </linearGradient>
    <linearGradient id="fullGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="fullConeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3A658" />
      <stop offset="100%" stop-color="#B86618" />
    </linearGradient>
    <linearGradient id="fullSwirlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFF2E2" />
    </linearGradient>
    <filter id="fullShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Emblem Icon (Left) -->
  <g transform="translate(2, 2)">
    <rect x="0" y="0" width="44" height="44" rx="11" fill="url(#fullDqGrad)" filter="url(#fullShadow)" />
    <rect x="0.5" y="0.5" width="43" height="43" rx="10.5" stroke="rgba(255,255,255,0.3)" stroke-width="1" />

    <!-- Cone -->
    <polygon points="22,40 14.5,29 29.5,29" fill="url(#fullConeGrad)" stroke="#8A4405" stroke-width="0.8" />
    <line x1="16.5" y1="32" x2="24.5" y2="38" stroke="#FFE7C7" stroke-width="0.75" stroke-linecap="round" opacity="0.6" />
    <line x1="27.5" y1="32" x2="19.5" y2="38" stroke="#7A3902" stroke-width="0.75" stroke-linecap="round" opacity="0.45" />

    <!-- Swirl tiers -->
    <path d="M13 29C13 26 16.5 24.5 22 24.5C27.5 24.5 31 26 31 29C31 30.5 28.5 30.8 22 30.8C15.5 30.8 13 30.5 13 29Z" fill="url(#fullSwirlGrad)" stroke="#ECDBC8" stroke-width="0.6" />
    <path d="M15 25C15 21.8 18 19.8 22 19.8C26 19.8 29 21.8 29 25C28.5 26.2 25.5 26.8 22 26.8C18.5 26.8 15.5 26.2 15 25Z" fill="url(#fullSwirlGrad)" stroke="#ECDBC8" stroke-width="0.6" />
    <path d="M17.5 20.2C17.5 16.5 20 14 22 14C23.5 14 25 15.2 25 17C25 18.5 23.5 19.2 22.2 19.2C20.8 19.2 18.5 19.5 17.5 20.2Z" fill="url(#fullSwirlGrad)" />
    <path d="M22 14C22.8 12.5 22.5 10 21 8.8C20 8 18.8 8.5 19 9.5C19.2 10.5 20.5 11.8 22 14Z" fill="url(#fullSwirlGrad)" stroke="#ECDBC8" stroke-width="0.6" />

    <!-- Guidance Star -->
    <g transform="translate(34, 10)">
      <path d="M0 -5 L1.2 -1.2 L5 0 L1.2 1.2 L0 5 L-1.2 1.2 L-5 0 L-1.2 -1.2 Z" fill="url(#fullGoldGrad)" stroke="#FFFFFF" stroke-width="0.7" />
    </g>
  </g>

  <!-- Typography: DQ Menu Guidance -->
  <text x="56" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="18" fill="#1E293B" letter-spacing="-0.3">
    <tspan fill="#E21837">DQ</tspan> Menu Guidance
  </text>
  <text x="56" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="9.5" fill="#64748B" letter-spacing="0.8">
    INDEPENDENT US GUIDE
  </text>
</svg>
